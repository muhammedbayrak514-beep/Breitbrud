name: BREIT BRUT 5 AI - Android APK V4

on:
  push:
    branches: [main, master, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: breit-brut-android-v4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Diagnose dependencies, run tests and build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract exact V4 source ZIP
        shell: bash
        run: |
          set -euo pipefail
          archive="$GITHUB_WORKSPACE/BREIT_BRUT_5_AI_APK_FIX_V4.zip"
          if [[ ! -s "$archive" ]]; then
            echo "ERROR: Missing BREIT_BRUT_5_AI_APK_FIX_V4.zip in repository root." >&2
            echo "Upload the exact V4 archive; remove old ZIPs so the workflow cannot build stale source." >&2
            ls -la "$GITHUB_WORKSPACE" >&2
            exit 1
          fi
          work="$RUNNER_TEMP/breit-v4-source"
          rm -rf "$work" && mkdir -p "$work"
          unzip -q "$archive" -d "$work"
          settings_file="$(find "$work" -type f \( -name settings.gradle.kts -o -name settings.gradle \) -print -quit)"
          [[ -n "$settings_file" ]] || { echo "No settings.gradle(.kts) found in V4 ZIP" >&2; exit 1; }
          project_root="$(dirname "$settings_file")"
          [[ -f "$project_root/app/build.gradle.kts" || -f "$project_root/app/build.gradle" ]] || { echo "No app module build file found beside settings file" >&2; exit 1; }
          python3 - "$project_root" "$GITHUB_WORKSPACE" <<'PY_COPY'
          from pathlib import Path
          import shutil, sys
          source, destination = Path(sys.argv[1]).resolve(), Path(sys.argv[2]).resolve()
          for item in source.iterdir():
              if item.name in {'.github', '.git', '__MACOSX'}:
                  continue
              target = destination / item.name
              if item.is_dir():
                  shutil.copytree(item, target, dirs_exist_ok=True)
              else:
                  shutil.copy2(item, target)
          PY_COPY
          mkdir -p ci-diagnostics
          echo "Source archive SHA-256:"
          sha256sum "$archive" | tee ci-diagnostics/source-sha256.txt
          echo "--- selected source / build versions ---" | tee ci-diagnostics/build-config.txt
          grep -nE 'com.android.application|org.jetbrains.kotlin|compose-bom|compileSdk|targetSdk|litertlm-android|compilerOptions|jvmTarget' build.gradle.kts app/build.gradle.kts | tee -a ci-diagnostics/build-config.txt
          echo "--- Gradle wrapper properties ---" | tee -a ci-diagnostics/build-config.txt
          cat gradle/wrapper/gradle-wrapper.properties | tee -a ci-diagnostics/build-config.txt
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f gradle/wrapper/gradle-wrapper.properties

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android API 36 packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 8.14.4
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14.4'
          cache-provider: basic
          validate-wrappers: false

      - name: Record toolchain versions
        shell: bash
        run: |
          set +e
          { java -version; gradle --version; } > ci-diagnostics/toolchain.log 2>&1
          cat ci-diagnostics/toolchain.log

      - name: Resolve debug runtime dependencies
        id: resolve_deps
        shell: bash
        run: |
          set +e
          gradle :app:dependencies --configuration debugRuntimeClasspath --no-daemon --stacktrace --info 2>&1 | tee ci-diagnostics/dependencies.log
          result=${PIPESTATUS[0]}
          echo "$result" > ci-diagnostics/dependencies.exit
          echo "Dependency report exit code: $result"
          exit 0

      - name: Diagnose Android AAR metadata (full details)
        id: aar_metadata
        shell: bash
        run: |
          set +e
          gradle :app:checkDebugAarMetadata --no-daemon --stacktrace --info 2>&1 | tee ci-diagnostics/aar-metadata.log
          result=${PIPESTATUS[0]}
          echo "$result" > ci-diagnostics/aar-metadata.exit
          echo "AAR metadata exit code: $result"
          exit 0

      - name: Run unit tests
        id: unit_tests
        shell: bash
        run: |
          set +e
          gradle testDebugUnitTest --no-daemon --stacktrace --info 2>&1 | tee ci-diagnostics/unit-tests.log
          result=${PIPESTATUS[0]}
          echo "$result" > ci-diagnostics/unit-tests.exit
          echo "Unit test exit code: $result"
          exit 0

      - name: Build debug APK
        id: build_apk
        shell: bash
        run: |
          set +e
          gradle assembleDebug --no-daemon --stacktrace --info 2>&1 | tee ci-diagnostics/assemble-debug.log
          result=${PIPESTATUS[0]}
          echo "$result" > ci-diagnostics/assemble-debug.exit
          echo "assembleDebug exit code: $result"
          exit 0

      - name: Package APK if generated
        id: package_apk
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          apk='app/build/outputs/apk/debug/app-debug.apk'
          if [[ -s "$apk" ]]; then
            mkdir -p dist
            cp "$apk" dist/BREIT_BRUT_5_AI-debug.apk
            sha256sum dist/BREIT_BRUT_5_AI-debug.apk | tee ci-diagnostics/apk-sha256.txt
            ls -lh dist/BREIT_BRUT_5_AI-debug.apk
            echo 'apk_available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'apk_available=false' >> "$GITHUB_OUTPUT"
            echo 'APK not generated; preserving all prior Gradle logs for diagnosis.' | tee ci-diagnostics/apk-not-generated.txt
          fi

      - name: Upload debug APK
        if: always() && steps.package_apk.outputs.apk_available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: BREIT_BRUT_5_AI-debug-APK
          path: dist/BREIT_BRUT_5_AI-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload full build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BREIT_BRUT_5_AI-V4-build-diagnostics
          path: |
            ci-diagnostics/**
            app/build/reports/tests/testDebugUnitTest/**
            app/build/test-results/testDebugUnitTest/**
            app/build/reports/problems/problems-report.html
          if-no-files-found: warn
          retention-days: 14

      - name: Build summary and final status
        if: always()
        shell: bash
        run: |
          set +e
          aar=$(cat ci-diagnostics/aar-metadata.exit 2>/dev/null || echo 99)
          tests=$(cat ci-diagnostics/unit-tests.exit 2>/dev/null || echo 99)
          build=$(cat ci-diagnostics/assemble-debug.exit 2>/dev/null || echo 99)
          deps=$(cat ci-diagnostics/dependencies.exit 2>/dev/null || echo 99)
          {
            echo '## BREIT BRUT 5 AI V4 build summary'
            echo "- Source/dependency resolution exit code: $deps"
            echo "- AAR metadata exit code: $aar"
            echo "- Unit-test exit code: $tests"
            echo "- assembleDebug exit code: $build"
            if [[ -s dist/BREIT_BRUT_5_AI-debug.apk ]]; then
              echo '- APK: generated; see the APK artifact.'
            else
              echo '- APK: not generated; download the **BREIT_BRUT_5_AI-V4-build-diagnostics** artifact and inspect the first real error in `aar-metadata.log` or `assemble-debug.log`.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$aar" != 0 || "$tests" != 0 || "$build" != 0 || ! -s dist/BREIT_BRUT_5_AI-debug.apk ]]; then
            echo 'Build failed. Full command output has been uploaded as an artifact.' >&2
            exit 1
          fi
