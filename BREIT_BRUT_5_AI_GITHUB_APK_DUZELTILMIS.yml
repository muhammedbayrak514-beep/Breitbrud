name: BREIT BRUT 5 AI - Android APK

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: breit-brut-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Extract source, test and build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # The GitHub repository contains the source ZIP and this workflow,
      # rather than the extracted Android project. Expand the ZIP BEFORE
      # setup-gradle, because setup-gradle scans for Gradle files itself.
      - name: Extract Android project from uploaded ZIP
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=( "$GITHUB_WORKSPACE"/*.zip "$GITHUB_WORKSPACE"/*.ZIP )
          if (( ${#archives[@]} == 0 )); then
            echo "ERROR: No source ZIP found in the repository root. Upload the BREIT BRUT 5 AI source ZIP to the root of the repository." >&2
            exit 1
          fi

          work="$RUNNER_TEMP/breit-brut-zip-diagnosis"
          rm -rf "$work"
          mkdir -p "$work"
          project_root=""

          for archive in "${archives[@]}"; do
            candidate="$work/candidate"
            rm -rf "$candidate"
            mkdir -p "$candidate"
            echo "Checking archive: $(basename "$archive")"
            if ! unzip -q "$archive" -d "$candidate"; then
              echo "Skipping unreadable ZIP: $(basename "$archive")" >&2
              continue
            fi

            settings_file="$(find "$candidate" -type f \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) -print -quit || true)"
            if [[ -z "$settings_file" ]]; then
              continue
            fi
            candidate_root="$(dirname "$settings_file")"
            if [[ -f "$candidate_root/app/build.gradle.kts" || -f "$candidate_root/app/build.gradle" ]]; then
              project_root="$candidate_root"
              echo "Android Gradle project found in: $(basename "$archive")"
              break
            fi
          done

          if [[ -z "$project_root" ]]; then
            echo "ERROR: No ZIP contained both settings.gradle(.kts) and app/build.gradle(.kts)." >&2
            echo "ZIP files present in repository root:" >&2
            printf ' - %s\n' "${archives[@]}" >&2
            echo "Archive file listings (first 80 entries per ZIP):" >&2
            for archive in "${archives[@]}"; do
              echo "--- $(basename "$archive") ---" >&2
              unzip -l "$archive" | head -80 >&2 || true
            done
            exit 1
          fi

          # Copy the Android project into the repository root so that
          # setup-gradle and the later Gradle commands can detect it.
          # Preserve the active workflow checked out from GitHub; do not
          # overwrite .github with the copy embedded inside the source ZIP.
          python3 - "$project_root" "$GITHUB_WORKSPACE" <<'PY'
          from pathlib import Path
          import shutil
          import sys

          source = Path(sys.argv[1]).resolve()
          destination = Path(sys.argv[2]).resolve()
          ignored = {".github", ".git", "__MACOSX"}

          for item in source.iterdir():
              if item.name in ignored:
                  continue
              target = destination / item.name
              if item.is_dir():
                  shutil.copytree(item, target, dirs_exist_ok=True)
              else:
                  shutil.copy2(item, target)
          PY

          if [[ ! -f "$GITHUB_WORKSPACE/gradlew" ]]; then
            echo "ERROR: Project extracted, but gradlew was not found at the project root." >&2
            exit 1
          fi
          chmod +x "$GITHUB_WORKSPACE/gradlew"
          echo "Extracted project root files:"
          ls -la "$GITHUB_WORKSPACE"
          echo "Gradle files discovered:"
          find "$GITHUB_WORKSPACE" -maxdepth 4 -type f \( -name '*.gradle' -o -name '*.gradle.kts' -o -name 'gradle-wrapper.properties' \) -print

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android API 36 packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      # Project includes a lightweight Gradle bootstrapper but no wrapper JAR.
      # Install Gradle directly; Gradle action now sees files extracted above.
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
          cache-provider: basic
          validate-wrappers: false

      - name: Check project files
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          echo "Project structure looks ready for an Android build."

      - name: Run unit tests
        id: unit_tests
        continue-on-error: true
        run: gradle testDebugUnitTest --no-daemon --stacktrace

      - name: Build debug APK
        id: build_apk
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Prepare and verify APK
        id: prepare_apk
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p dist
          cp "$APK" "dist/BREIT_BRUT_5_AI-debug.apk"
          sha256sum "dist/BREIT_BRUT_5_AI-debug.apk"
          ls -lh "dist/BREIT_BRUT_5_AI-debug.apk"

      - name: Upload debug APK
        if: always() && steps.prepare_apk.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          path: dist/BREIT_BRUT_5_AI-debug.apk
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: breit-brut-android-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14

      - name: Write workflow summary
        if: always()
        shell: bash
        run: |
          {
            echo "## BREIT BRUT 5 AI - Android APK build"
            echo "- Unit tests: \`${{ steps.unit_tests.outcome }}\`"
            echo "- APK build: \`${{ steps.build_apk.outcome }}\`"
            if [ -s "dist/BREIT_BRUT_5_AI-debug.apk" ]; then
              echo "- APK file: \`BREIT_BRUT_5_AI-debug.apk\` (artifact uploaded)"
            else
              echo "- APK file: not generated"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail workflow if unit tests failed
        if: steps.unit_tests.outcome == 'failure'
        run: |
          echo "Unit tests failed. If assembleDebug succeeded, the APK artifact may still be available above."
          exit 1
