name: BREIT BRUT 5 AI - P0 Android CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: breit-brut-android-p0-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Validate, test and build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      JAVA_VERSION: '17'
      GRADLE_VERSION: '8.14.4'
      ANDROID_API: '36'
      ANDROID_BUILD_TOOLS: '36.0.0'
      DIAGNOSTICS_DIR: ${{ github.workspace }}/ci-diagnostics
      DIST_DIR: ${{ github.workspace }}/dist

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.14.4
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14.4'
          cache-provider: basic
          # This project currently uses a checksum-verifying bootstrap script
          # rather than the standard Gradle wrapper JAR. CI invokes the pinned
          # Gradle installation directly, so wrapper-JAR validation is not used.
          validate-wrappers: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "platform-tools"

      - name: Select clean source directory
        id: source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$DIAGNOSTICS_DIR" "$DIST_DIR"
          workspace="$GITHUB_WORKSPACE"

          if [[ -f "$workspace/settings.gradle.kts" && -f "$workspace/app/build.gradle.kts" ]]; then
            project_dir="$workspace"
            echo "Source mode: using the checked-out Android project directly."
          elif [[ -f "$workspace/settings.gradle" && -f "$workspace/app/build.gradle" ]]; then
            project_dir="$workspace"
            echo "Source mode: using the checked-out Groovy Android project directly."
          else
            archive="$workspace/BREIT_BRUT_5_AI_P0.zip"
            if [[ ! -s "$archive" ]]; then
              archive="$workspace/BREIT_BRUT_5_AI_APK_FIX_V9.zip"
            fi
            if [[ ! -s "$archive" ]]; then
              echo "ERROR: Android project sources were not found in repository root." >&2
              echo "Commit the extracted Android project, or place BREIT_BRUT_5_AI_P0.zip (or the legacy V9 ZIP) in the repository root." >&2
              ls -la "$workspace" >&2
              exit 1
            fi

            staging="$RUNNER_TEMP/breit-brut-p0-staging"
            rm -rf "$staging"
            mkdir -p "$staging"

            # Extract the source archive only into a fresh temporary directory.
            # Reject traversal paths, symlinks, duplicate entries and oversized archives.
            python3 - "$archive" "$staging" <<'PY_EXTRACT'
          from pathlib import Path, PurePosixPath
          import shutil, stat, sys, zipfile

          archive = Path(sys.argv[1])
          destination = Path(sys.argv[2]).resolve()
          max_entries = 2000
          max_uncompressed = 512 * 1024 * 1024
          seen = set()

          with zipfile.ZipFile(archive) as zf:
              entries = zf.infolist()
              if len(entries) > max_entries:
                  raise SystemExit(f"ZIP contains too many entries: {len(entries)}")
              total_size = sum(item.file_size for item in entries)
              if total_size > max_uncompressed:
                  raise SystemExit(f"ZIP expands beyond allowed limit: {total_size} bytes")
              corrupt = zf.testzip()
              if corrupt:
                  raise SystemExit(f"Corrupt ZIP member: {corrupt}")

              for item in entries:
                  name = item.filename
                  relative = PurePosixPath(name)
                  if not name or relative.is_absolute() or ".." in relative.parts:
                      raise SystemExit(f"Unsafe ZIP path: {name!r}")
                  normalized = relative.as_posix().rstrip("/")
                  if normalized in seen:
                      raise SystemExit(f"Duplicate ZIP path: {name!r}")
                  seen.add(normalized)
                  mode = (item.external_attr >> 16) & 0o170000
                  if mode == stat.S_IFLNK:
                      raise SystemExit(f"Symlink entry is not allowed: {name!r}")
                  target = (destination / Path(*relative.parts)).resolve()
                  if target != destination and destination not in target.parents:
                      raise SystemExit(f"ZIP path escapes extraction directory: {name!r}")
                  if item.is_dir():
                      target.mkdir(parents=True, exist_ok=True)
                      continue
                  target.parent.mkdir(parents=True, exist_ok=True)
                  with zf.open(item, "r") as source, target.open("wb") as output:
                      shutil.copyfileobj(source, output)
          PY_EXTRACT

            project_dir="$(python3 - "$staging" <<'PY_FIND'
          from pathlib import Path
          import sys

          base = Path(sys.argv[1]).resolve()
          candidates = []
          for settings in list(base.rglob("settings.gradle.kts")) + list(base.rglob("settings.gradle")):
              parent = settings.parent
              if (parent / "app/build.gradle.kts").is_file() or (parent / "app/build.gradle").is_file():
                  candidates.append(parent)
          unique = sorted(set(candidates))
          if len(unique) != 1:
              raise SystemExit(f"Expected exactly one Android Gradle project in ZIP, found {len(unique)}: {unique}")
          print(unique[0])
          PY_FIND
          )"
            echo "Source mode: extracted the ZIP into a clean temporary directory."
            echo "Source archive SHA-256: $(sha256sum "$archive" | awk '{print $1}')" | tee "$DIAGNOSTICS_DIR/source-sha256.txt"
          fi

          for required in settings.gradle.kts build.gradle.kts app/build.gradle.kts app/src/main/AndroidManifest.xml gradle/wrapper/gradle-wrapper.properties; do
            if [[ ! -s "$project_dir/$required" ]]; then
              echo "ERROR: Required project file is missing: $required" >&2
              exit 1
            fi
          done

          echo "Project directory: $project_dir" | tee "$DIAGNOSTICS_DIR/source-selection.txt"
          echo "project_dir=$project_dir" >> "$GITHUB_OUTPUT"

      - name: Run project preflight checks
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.source.outputs.project_dir }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          {
            echo "Project root: $PROJECT_DIR"
            echo "Gradle distribution declared in wrapper properties:"
            grep '^distributionUrl=' gradle/wrapper/gradle-wrapper.properties
            echo "Android/Kotlin plugin versions:"
            grep -nE 'com.android.application|org.jetbrains.kotlin.android|org.jetbrains.kotlin.plugin.compose' build.gradle.kts
            echo "Android SDK / app version:"
            grep -nE 'compileSdk|targetSdk|minSdk|versionCode|versionName' app/build.gradle.kts
          } | tee "$DIAGNOSTICS_DIR/preflight.log"

          grep -Fq 'gradle-8.14.4-bin.zip' gradle/wrapper/gradle-wrapper.properties
          grep -Fq 'distributionSha256Sum=f1771298a70f6db5a29daf62378c4e18a17fc33c9ba6b14362e0cdf40610380d' gradle/wrapper/gradle-wrapper.properties
          grep -Fq 'GRADLE_SHA256="f1771298a70f6db5a29daf62378c4e18a17fc33c9ba6b14362e0cdf40610380d"' gradlew
          grep -Fq 'GRADLE_VERSION="8.14.4"' gradlew
          grep -Fq 'set GRADLE_VERSION=8.14.4' gradlew.bat
          grep -Fq 'id("com.android.application") version "8.13.2"' build.gradle.kts
          grep -Fq 'compileSdk = 36' app/build.gradle.kts
          grep -Fq 'targetSdk = 36' app/build.gradle.kts
          test -d app/src/test
          test -d app/src/main/java
          echo "P0 preflight checks: PASS" | tee -a "$DIAGNOSTICS_DIR/preflight.log"

      - name: Record toolchain versions
        shell: bash
        run: |
          set +e
          { java -version; gradle --version; sdkmanager --version; } > "$DIAGNOSTICS_DIR/toolchain.log" 2>&1
          result=$?
          cat "$DIAGNOSTICS_DIR/toolchain.log"
          exit "$result"

      - name: Resolve debug runtime dependencies
        id: resolve_deps
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.source.outputs.project_dir }}
        run: |
          set +e
          gradle -p "$PROJECT_DIR" :app:dependencies --configuration debugRuntimeClasspath --no-daemon --stacktrace --info 2>&1 | tee "$DIAGNOSTICS_DIR/dependencies.log"
          result=${PIPESTATUS[0]}
          echo "$result" > "$DIAGNOSTICS_DIR/dependencies.exit"
          echo "Dependency report exit code: $result"
          exit 0

      - name: Diagnose Android AAR metadata
        id: aar_metadata
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.source.outputs.project_dir }}
        run: |
          set +e
          gradle -p "$PROJECT_DIR" :app:checkDebugAarMetadata --no-daemon --stacktrace --info 2>&1 | tee "$DIAGNOSTICS_DIR/aar-metadata.log"
          result=${PIPESTATUS[0]}
          echo "$result" > "$DIAGNOSTICS_DIR/aar-metadata.exit"
          echo "AAR metadata exit code: $result"
          exit 0

      - name: Run unit tests and capture compiler errors
        id: unit_tests
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.source.outputs.project_dir }}
        run: |
          set +e
          gradle -p "$PROJECT_DIR" :app:testDebugUnitTest --no-daemon --stacktrace --info 2>&1 | tee "$DIAGNOSTICS_DIR/unit-tests.log"
          result=${PIPESTATUS[0]}
          echo "$result" > "$DIAGNOSTICS_DIR/unit-tests.exit"
          grep -E '^(e: file://|w: file://|> Task .*FAILED|FAILURE:|Execution failed for task|What went wrong:|Caused by:|BUILD FAILED)' "$DIAGNOSTICS_DIR/unit-tests.log" > "$DIAGNOSTICS_DIR/unit-test-errors.txt" || true
          echo "Unit-test exit code: $result"
          exit 0

      - name: Build debug APK and capture compiler errors
        id: build_apk
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.source.outputs.project_dir }}
        run: |
          set +e
          gradle -p "$PROJECT_DIR" :app:assembleDebug --no-daemon --stacktrace --info 2>&1 | tee "$DIAGNOSTICS_DIR/assemble-debug.log"
          result=${PIPESTATUS[0]}
          echo "$result" > "$DIAGNOSTICS_DIR/assemble-debug.exit"
          grep -E '^(e: file://|w: file://|> Task .*FAILED|FAILURE:|Execution failed for task|What went wrong:|Caused by:|BUILD FAILED)' "$DIAGNOSTICS_DIR/assemble-debug.log" | head -n 300 > "$DIAGNOSTICS_DIR/assemble-errors.txt" || true
          echo "assembleDebug exit code: $result"
          exit 0

      - name: Package APK if generated
        id: package_apk
        if: always()
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.source.outputs.project_dir }}
        run: |
          set -euo pipefail
          apk="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          mkdir -p "$DIST_DIR"
          if [[ -s "$apk" ]]; then
            cp "$apk" "$DIST_DIR/BREIT_BRUT_5_AI-debug.apk"
            sha256sum "$DIST_DIR/BREIT_BRUT_5_AI-debug.apk" | tee "$DIAGNOSTICS_DIR/apk-sha256.txt"
            ls -lh "$DIST_DIR/BREIT_BRUT_5_AI-debug.apk"
            echo 'apk_available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'apk_available=false' >> "$GITHUB_OUTPUT"
            echo 'APK not generated; inspect assemble-debug.log and assemble-errors.txt.' | tee "$DIAGNOSTICS_DIR/apk-not-generated.txt"
          fi

      - name: Upload debug APK
        if: always() && steps.package_apk.outputs.apk_available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: BREIT_BRUT_5_AI-P0-debug-APK
          path: ${{ github.workspace }}/dist/BREIT_BRUT_5_AI-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload full build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BREIT_BRUT_5_AI-P0-build-diagnostics
          path: |
            ci-diagnostics/**
            ${{ steps.source.outputs.project_dir }}/app/build/reports/tests/testDebugUnitTest/**
            ${{ steps.source.outputs.project_dir }}/app/build/test-results/testDebugUnitTest/**
            ${{ steps.source.outputs.project_dir }}/app/build/reports/problems/problems-report.html
          if-no-files-found: warn
          retention-days: 14

      - name: Build summary and final status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          deps=$(cat "$DIAGNOSTICS_DIR/dependencies.exit" 2>/dev/null || echo 99)
          aar=$(cat "$DIAGNOSTICS_DIR/aar-metadata.exit" 2>/dev/null || echo 99)
          tests=$(cat "$DIAGNOSTICS_DIR/unit-tests.exit" 2>/dev/null || echo 99)
          build=$(cat "$DIAGNOSTICS_DIR/assemble-debug.exit" 2>/dev/null || echo 99)
          apk_status="not generated"
          if [[ -s "$DIST_DIR/BREIT_BRUT_5_AI-debug.apk" ]]; then
            apk_status="generated"
          fi
          {
            echo '## BREIT BRUT 5 AI — P0 build summary'
            echo "- Source preflight: see preflight.log"
            echo "- Dependency report exit code: $deps"
            echo "- AAR metadata exit code: $aar"
            echo "- Unit-test exit code: $tests"
            echo "- assembleDebug exit code: $build"
            echo "- Debug APK: $apk_status"
            if [[ "$apk_status" == "not generated" ]]; then
              echo '- Next step: download the diagnostics artifact and inspect `assemble-errors.txt` and `assemble-debug.log`.'
            else
              echo '- Artifact: `BREIT_BRUT_5_AI-P0-debug-APK`.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$deps" != 0 || "$aar" != 0 || "$tests" != 0 || "$build" != 0 || ! -s "$DIST_DIR/BREIT_BRUT_5_AI-debug.apk" ]]; then
            echo 'P0 CI failed: at least one required check failed or APK was not generated.' >&2
            exit 1
          fi
