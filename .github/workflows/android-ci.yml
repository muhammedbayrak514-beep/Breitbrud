name: BREIT BRUT 5 AI - Android APK

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: breit-brut-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Test and build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android API 36 packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
          cache-provider: basic
          validate-wrappers: false

      - name: Check project files
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          echo "Project structure looks ready for an Android build."

      - name: Run unit tests
        id: unit_tests
        continue-on-error: true
        run: gradle testDebugUnitTest --no-daemon --stacktrace

      - name: Build debug APK
        id: build_apk
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Prepare and verify APK
        id: prepare_apk
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p dist
          cp "$APK" "dist/BREIT_BRUT_5_AI-debug.apk"
          sha256sum "dist/BREIT_BRUT_5_AI-debug.apk"
          ls -lh "dist/BREIT_BRUT_5_AI-debug.apk"

      - name: Upload debug APK
        if: always() && steps.prepare_apk.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          path: dist/BREIT_BRUT_5_AI-debug.apk
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: breit-brut-android-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14

      - name: Write workflow summary
        if: always()
        shell: bash
        run: |
          {
            echo "## BREIT BRUT 5 AI - Android APK build"
            echo "- Unit tests: `${{ steps.unit_tests.outcome }}`"
            echo "- APK build: `${{ steps.build_apk.outcome }}`"
            if [ -s "dist/BREIT_BRUT_5_AI-debug.apk" ]; then
              echo "- APK file: `BREIT_BRUT_5_AI-debug.apk` (artifact uploaded)"
            else
              echo "- APK file: not generated"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail workflow if unit tests failed
        if: steps.unit_tests.outcome == 'failure'
        run: |
          echo "Unit tests failed. If assembleDebug succeeded, the APK artifact is still available above."
          exit 1
